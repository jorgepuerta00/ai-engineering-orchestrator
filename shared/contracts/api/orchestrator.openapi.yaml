openapi: 3.1.0
info:
  title: AI SDLC Orchestrator API
  version: 0.1.0
paths:
  /v1/workflows/{workflowId}/runs:
    post:
      summary: Request a workflow run
      operationId: createWorkflowRun
      parameters:
        - in: path
          name: workflowId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasoning_reference]
              properties:
                reasoning_reference:
                  type: string
      responses:
        '202':
          description: Accepted
